[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rl-parallel-parking"
version = "0.1.0"
description = "Reproducible reinforcement-learning research for parallel and reverse-bay parking"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lemonterminator" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9",
]

[project.scripts]
parking-governance = "parking_rl.governance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parking_rl"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
